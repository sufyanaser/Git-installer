name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GitHubAutoInstaller.SmokeTests/GitHubAutoInstaller.SmokeTests.csproj
      - name: Verify formatting
        run: |
          dotnet format GitHubAutoInstaller.csproj --no-restore --verify-no-changes
          dotnet format GitHubAutoInstaller.SmokeTests/GitHubAutoInstaller.SmokeTests.csproj --no-restore --verify-no-changes
      - name: Build
        run: dotnet build GitHubAutoInstaller.SmokeTests/GitHubAutoInstaller.SmokeTests.csproj --no-restore --configuration Release
      - name: Run smoke tests
        run: dotnet run --no-build --configuration Release --project GitHubAutoInstaller.SmokeTests/GitHubAutoInstaller.SmokeTests.csproj
      - name: Publish Windows x64
        run: dotnet publish GitHubAutoInstaller.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubAutoInstaller-win-x64
          path: artifacts/publish/GitHubAutoInstaller.exe
          if-no-files-found: error
